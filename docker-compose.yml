services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend-src:/app
      - ./pyproject.toml:/pyproject.toml
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/samples.db
      FLASK_DEBUG: "1"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-src:/app/frontend-src
      - ./frontend-src/index.html:/app/frontend-src/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./vitest.config.js:/app/vitest.config.js
      - ./eslint.config.js:/app/eslint.config.js
      - ./dist:/app/dist
    environment:
      API_URL: http://backend:5001
    depends_on:
      - backend
