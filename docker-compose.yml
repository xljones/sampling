services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    ports:
      - "5001:5001"
    volumes:
      - ./backend-src/app.py:/app/app.py
      - ./backend-src/manage.py:/app/manage.py
      - ./backend-src/sampling:/app/sampling
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/samples.db
      FLASK_DEBUG: "1"

  # Dev tooling (lint / typecheck / test) — not started by make run
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    volumes:
      - ./backend-src:/app
      - ./pyproject.toml:/app/pyproject.toml
    profiles:
      - dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-src:/app/frontend-src
      - ./frontend-src/index.html:/app/frontend-src/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./vitest.config.js:/app/vitest.config.js
      - ./eslint.config.js:/app/eslint.config.js
    environment:
      API_URL: http://backend:5001
    depends_on:
      - backend
