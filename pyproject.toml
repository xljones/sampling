[project]
name = "sampling"
version = "0.0.2"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
# no testpaths — always specify explicitly (paths differ between Docker and CI)
